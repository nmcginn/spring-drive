<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spring Drive</title>
    <meta
      name="description"
      content="How Seiko's Spring Drive keeps time, explained with interactive simulations."
    />
    <!-- The favicon and home-screen icon are the glide wheel's magnet, and public/og-image.png is the card a shared link shows. All three are drawn from the palette by `npm run og-image` (decision 42). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What a shared link shows. The title and description repeat the two above, and tests hold them equal. The build makes these URLs absolute from SITE_URL, or this deployment's CF_PAGES_URL, and leaves out the page's own URL when SITE_URL is not set (decision 42). `vite-ignore` stops Vite reading "/" as a file. -->
    <link rel="canonical" href="/" vite-ignore />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Spring Drive" />
    <meta
      property="og:description"
      content="How Seiko's Spring Drive keeps time, explained with interactive simulations."
    />
    <meta property="og:url" content="/" vite-ignore />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The words Spring Drive and the article's description beside a watch dial, with the glide wheel's magnet under its coil."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="The words Spring Drive and the article's description beside a watch dial, with the glide wheel's magnet under its coil."
    />
    <!-- The palette is inlined here at build time from src/runtime/palette.ts, so the prose is coloured before any script runs. -->
    <style id="palette"></style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- First in the document, though it sits at the bottom of the screen, so stopping every animation is the first Tab stop rather than the last (decision 41). -->
    <button type="button" class="global-pause" data-global-pause hidden>
      Pause animations
    </button>
    <main class="article">
      <header>
        <h1>Spring Drive</h1>
      </header>

      <section id="intro" aria-labelledby="intro-title">
        <h2 id="intro-title" class="visually-hidden">Introduction</h2>
        <!-- PROSE: open on the gliding seconds hand, and the question of how a mechanical watch can move without ticking. -->
        <figure class="widget-slot" data-widget="hero-glide"></figure>
        <!-- PROSE: point the reader at the magnifiers: the mechanical hand jumps 0.75° eight times a second, the Spring Drive <span class="part" data-part="hand">seconds hand</span> never jumps at all, and Slow motion makes the difference plain. Both watches are shown keeping perfect time; say that neither is a model of a particular watch's accuracy. -->
        <!-- PROSE: introduce the parts by name: the <span class="part" data-part="mainspring">mainspring</span>, the <span class="part" data-part="rotor">glide wheel</span>, the <span class="part" data-part="coil">coils</span>, the <span class="part" data-part="quartz">quartz crystal</span>, and the <span class="part" data-part="ic">IC</span>. -->
      </section>

      <section id="runaway" aria-labelledby="runaway-title">
        <h2 id="runaway-title">The runaway</h2>
        <!-- PROSE: a <span class="part" data-part="mainspring">mainspring</span> driving a free <span class="part" data-part="rotor">glide wheel</span> overspins and runs down fast. Invite the reader to press Wind. -->
        <figure class="widget-slot" data-widget="runaway"></figure>
        <!-- PROSE: what the reader just saw. With nothing holding it back, the <span class="part" data-part="rotor">glide wheel</span> settles near 30.6 rev/s, almost four times the 8 rev/s that keeps time, so the <span class="part" data-part="hand">hands</span> gain nearly three hours for every hour (the model gives 3.8× at full wind). Fast-forward shows the <span class="part" data-part="mainspring">mainspring</span> spent in about 29 hours rather than 72, though the hands have still counted off nearly 72 hours of turns (PHYSICS.md, D8). Say these figures are the model's: its torque curve, friction, and inertia are assumptions (PHYSICS.md), and this project found no published figure for a real 9R running unregulated. Lead into the question of how to hold the wheel back without a ticking escapement. -->
      </section>

      <section id="generator" aria-labelledby="generator-title">
        <h2 id="generator-title">Spinning makes electricity</h2>
        <!-- PROSE: the <span class="part" data-part="rotor">glide wheel</span> carries a magnet, and as its poles sweep past the <span class="part" data-part="coil">coils</span> the changing flux induces an EMF (Faraday's law). Invite the reader to drag the speed slider. -->
        <figure class="widget-slot" data-widget="generator"></figure>
        <!-- PROSE: what the reader just saw. The EMF alternates, one cycle each time a north and a south pole pass the <span class="part" data-part="coil">coil</span>, and both its height and its frequency grow in proportion to the <span class="part" data-part="rotor">glide wheel</span>'s speed: double the speed, double the voltage. At 8 rev/s the model's EMF averages 1.0 V once rectified and peaks at 1.57 V; the rectifier charges the capacitor from those peaks, to about 1.34 V (PHYSICS.md, D5), which the next sections rely on. Say these figures are the model's: the 1.0 V, the sine shape, and the single pole pair are assumptions (PHYSICS.md, D4 and D9), and the one coil drawn stands for the 9R's winding, whose layout this project has not sourced. Note that here the reader turns the wheel and nothing draws current, so nothing pushes back; lead into the next section, where drawing current brakes the wheel. -->
      </section>

      <section id="lenz-brake" aria-labelledby="lenz-brake-title">
        <h2 id="lenz-brake-title">Electricity pushes back</h2>
        <!-- PROSE: drawing current from the <span class="part" data-part="coil">coil</span> brakes the <span class="part" data-part="rotor">glide wheel</span>. The current the moving magnet induces makes a magnetic field of its own that opposes the motion (Lenz's law), so every joule the coil turns to heat comes out of the wheel's motion. Open, the coil carries no current and does nothing; shorted, it brakes. Explain that the watch shorts it in short bursts, and the fraction of the time it is shorted sets the average braking. Invite the reader to let the wheel go from 8 rev/s and try different settings of the slider. -->
        <figure class="widget-slot" data-widget="lenz-brake"></figure>
        <!-- PROSE: what the reader just saw. Here the <span class="part" data-part="mainspring">mainspring</span> is left out, so only friction and the brake slow the <span class="part" data-part="rotor">glide wheel</span>. With the <span class="part" data-part="coil">coil</span> open, friction alone stops it in about 1.1 s; shorted all the time, it stops in about 0.11 s, because at 8 rev/s the full brake is about 21 times friction (the model's 199 nN·m against 9.5 nN·m). The brake is proportional to speed and to the time shorted, so it is a smooth, adjustable drag with nothing touching the wheel. Say these figures are the model's (PHYSICS.md, D4 and D10): the coil's resistance, the EMF constant, and the friction are assumptions, and the widget's all-or-nothing switch stands for a circuit whose details Seiko has not published. What is not an assumption is the link to the previous section: the brake is exactly the heat the waveform the reader just saw would make in the coil, so the two widgets agree. Lead into the next question: to hold 8 rev/s, the brake has to know how fast the wheel should turn, which needs a reference. -->
      </section>

      <section id="quartz" aria-labelledby="quartz-title">
        <h2 id="quartz-title">A reference that doesn't drift</h2>
        <!-- PROSE: to hold the <span class="part" data-part="rotor">glide wheel</span> at 8 rev/s the watch needs something that keeps better time than the wheel itself. Introduce the <span class="part" data-part="quartz">quartz crystal</span>: a tiny tuning fork cut from quartz, which rings at one frequency when driven, 32,768 Hz in a watch. Say why that number: it is 2¹⁵, so a chain of dividers, each halving the frequency of the one before, gets to a slow, exact tick with nothing but counting. The <span class="part" data-part="ic">IC</span>'s chain stops twelve halvings down, at 8 Hz, one tick for every turn the glide wheel should make. Invite the reader to drag the slider to slow the crystal down until they can see it swing. -->
        <figure class="widget-slot" data-widget="quartz"></figure>
        <!-- PROSE: what the reader just saw. Each row is one stage's output, half the frequency of the row above: the <span class="part" data-part="quartz">crystal</span>'s swing squared into a clock at the top, the 8 Hz reference at the bottom. Read down the lamps at the right and they are the bits of a binary count of the crystal's cycles; the dashed lines are where the count reaches 4,096 and starts again, every stage falling at once, and each of those is a reference tick. At real time only the last three stages are slow enough to draw; slowed 4,096 times, the crystal swings as slowly as the reference ticks at real time. The point of the section: the reference never drifts relative to the crystal, because it is counted from it, so the watch is as good as its crystal. Say what the model leaves out (PHYSICS.md, D11, and decision 26): its crystal is exact, where a real one is cut to a tolerance and drifts with temperature (give no figure for either: none is published for the 9R), which is most of what the 9R's rated ±15 s/month allows for. Say also that the drawing is a model: the tuning-fork shape is the usual watch crystal's, the swing is exaggerated many times, and the 8 Hz tap and the ripple-counter layout are this project's model of the principle, since Seiko has not published the 9R's IC. Lead into the next section: the IC now has a reference to compare the glide wheel with. -->
      </section>

      <section id="loop" aria-labelledby="loop-title">
        <h2 id="loop-title">Closing the loop</h2>
        <!-- PROSE: the <span class="part" data-part="ic">IC</span> compares the <span class="part" data-part="rotor">glide wheel</span> against the reference and sets the brake. At every reference tick, eight times a second, it asks how far the wheel is ahead of where it should be (the phase error), and shorts the <span class="part" data-part="coil">coil</span> for more of the time if the wheel is ahead, less if it is behind. Explain how to read the widget: the wheel is drawn as the reference sees it, turned by the phase error, so a wheel held at 8 rev/s stands still with its north pole under the reference mark. Invite the reader to knock the watch, and to switch regulation off. -->
        <figure class="widget-slot" data-widget="loop"></figure>
        <!-- PROSE: what the reader just saw. A knock of 2 rev/s swings the wheel off the reference by up to about a fifth of a turn (in the model, at full wind, 35° to 47° for a knock forward and 52° to 66° for one back, depending on when it lands between ticks: PHYSICS.md, D12), and the brake duty rises or falls as the <span class="part" data-part="ic">IC</span> pulls it back; lock returns within 3 s. Nothing needs to know which way the knock went: the same rule handles both, because the brake is already partly on. The <span class="part" data-part="mainspring">mainspring</span> always pushes harder than 8 rev/s needs, so at full wind the model shorts the coil about 11% of the time just to hold it, and a wheel knocked back is let off the brake to catch up. With regulation off, the wheel runs away as in the first section, and the phase error grows by about 22 turns every second, heading for 22.6 as the wheel reaches full speed. Turned back on, the IC starts counting again from wherever the wheel is, as it does when it powers up, so it does not try to win back the turns already gained; the <span class="part" data-part="hand">hands</span> keep them, which the "Hands vs true time" readout shows. Say what is modelled (decision 6 and PHYSICS.md, D6 and D12): the controller is a PID law chosen for this model, the knock is an instant change of speed, and the restart on switching back on is this widget's choice; Seiko has not published the 9R's control law, how its IC responds to shocks, or whether it can be switched off at all. Lead into the last section: the whole system, over the whole reserve. -->
      </section>

      <section id="tri-synchro" aria-labelledby="tri-synchro-title">
        <h2 id="tri-synchro-title">Tri-synchro, all together</h2>
        <!-- PROSE: the whole system at once, and why Seiko calls it tri-synchro: the <span class="part" data-part="mainspring">mainspring</span>'s mechanical energy turns the <span class="part" data-part="rotor">glide wheel</span>; the <span class="part" data-part="coil">coil</span> turns a little of that into electricity, stored in the <span class="part" data-part="capacitor">capacitor</span>, that runs the <span class="part" data-part="quartz">crystal</span> and the <span class="part" data-part="ic">IC</span>; and the IC uses the same coil as an electromagnetic brake to hold the wheel to the crystal. Nothing else powers the watch: no battery. Explain how to read the widget: time is sped up, the faint hands are true time, the bars show where the power reaching the glide wheel goes, and the chart runs over the whole reserve. Invite the reader to let it run to the end, or to skip ahead and slow time near it. -->
        <figure class="widget-slot" data-widget="tri-synchro"></figure>
        <!-- PROSE: what the reader just saw. For about 70 hours nothing visible changes: the <span class="part" data-part="hand">hands</span> keep perfect time, the <span class="part" data-part="capacitor">supply</span> sits near 1.34 V, and only the brake eases off, from about 11% of the time to 3%, as the <span class="part" data-part="mainspring">mainspring</span> weakens. The brake is where most of the spare power goes: at full wind it takes about two thirds of what reaches the <span class="part" data-part="rotor">glide wheel</span>, friction most of the rest, and the electronics under 2% (the model's 29 nW of 1.63 µW). Then, in the model, at 70 h 39 min the spring can no longer hold 8 rev/s, the brake is already off, and the watch starts losing time; the <span class="part" data-part="ic">IC</span> keeps running on the slowing wheel for another half hour, browns out at 4.3 rev/s, and the wheel stops at 73 h 46 min, its hands about two hours behind (PHYSICS.md, D7 and D13). Say that the power reserve gauge reads the spring, not what it can still do, so it still shows about 1.3 h when regulation ends. Say plainly that the 72 h is Seiko's and every other time and voltage here is the model's; say that the rate reads 0 s/day only because the model's crystal is exact, and that Seiko rates the 9R65 at ±15 s/month, which allows for a real one (decision 26). -->
        <!-- PROSE: close the article by saying plainly which numbers are Seiko's and which are the model's. Real, and published: 8 rev/s, 32,768 Hz, 72 h, and ±15 s/month. Widely reported but not confirmed from Seiko: the IC's 25 nW. Everything else (torques, friction, the coil, the capacitor, the controller, and every time and voltage that follows from them) is the model's: chosen to be plausible, and checked against comparable real parts where a comparison exists (PHYSICS.md, "Plausibility check"), but not measured from a 9R. "Plausible" may be said only where that table says "checked"; nowhere may a model figure be called the 9R's. Mention any known gap the table lists when this is written (M7b closed the one about the supply voltage). -->
      </section>

      <footer class="article-footer">
        <p class="footnote">
          Thanks to Bartosz Ciechanowski, whose
          <a href="https://ciechanow.ski/mechanical-watch/">Mechanical Watch</a>
          inspired this project.
        </p>
      </footer>
    </main>
  </body>
</html>
