<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spring Drive</title>
    <!-- No favicon yet (M9 adds sharing metadata). An empty data: icon stops the browser requesting /favicon.ico and logging a 404. -->
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="How Seiko's Spring Drive keeps time, explained with interactive simulations."
    />
    <!-- The palette is inlined here at build time from src/runtime/palette.ts, so the prose is coloured before any script runs. -->
    <style id="palette"></style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="article">
      <header>
        <h1>Spring Drive</h1>
      </header>

      <section id="intro" aria-labelledby="intro-title">
        <h2 id="intro-title" class="visually-hidden">Introduction</h2>
        <!-- PROSE: open on the gliding seconds hand, and the question of how a mechanical watch can move without ticking. -->
        <figure class="widget-slot" data-widget="hero-glide"></figure>
        <!-- PROSE: point the reader at the magnifiers: the mechanical hand jumps 0.75° eight times a second, the Spring Drive <span class="part" data-part="hand">seconds hand</span> never jumps at all, and Slow motion makes the difference plain. Both watches are shown keeping perfect time; say that neither is a model of a particular watch's accuracy. -->
        <!-- PROSE: introduce the parts by name: the <span class="part" data-part="mainspring">mainspring</span>, the <span class="part" data-part="rotor">glide wheel</span>, the <span class="part" data-part="coil">coils</span>, the <span class="part" data-part="quartz">quartz crystal</span>, and the <span class="part" data-part="ic">IC</span>. -->
      </section>

      <section id="runaway" aria-labelledby="runaway-title">
        <h2 id="runaway-title">The runaway</h2>
        <!-- PROSE: a <span class="part" data-part="mainspring">mainspring</span> driving a free <span class="part" data-part="rotor">glide wheel</span> overspins and runs down fast. Invite the reader to press Wind. -->
        <figure class="widget-slot" data-widget="runaway"></figure>
        <!-- PROSE: what the reader just saw. With nothing holding it back, the <span class="part" data-part="rotor">glide wheel</span> settles near 30.6 rev/s, almost four times the 8 rev/s that keeps time, so the <span class="part" data-part="hand">hands</span> gain nearly three hours for every hour (the model gives 3.8× at full wind). Fast-forward shows the <span class="part" data-part="mainspring">mainspring</span> spent in about 29 hours rather than 72, though the hands have still counted off nearly 72 hours of turns (PHYSICS.md, D8). Say these figures are the model's: its torque curve, friction, and inertia are assumptions (PHYSICS.md), and this project found no published figure for a real 9R running unregulated. Lead into the question of how to hold the wheel back without a ticking escapement. -->
      </section>

      <section id="generator" aria-labelledby="generator-title">
        <h2 id="generator-title">Spinning makes electricity</h2>
        <!-- PROSE: the <span class="part" data-part="rotor">glide wheel</span> carries a magnet, and as its poles sweep past the <span class="part" data-part="coil">coils</span> the changing flux induces an EMF (Faraday's law). Invite the reader to drag the speed slider. -->
        <figure class="widget-slot" data-widget="generator"></figure>
        <!-- PROSE: what the reader just saw. The EMF alternates, one cycle each time a north and a south pole pass the <span class="part" data-part="coil">coil</span>, and both its height and its frequency grow in proportion to the <span class="part" data-part="rotor">glide wheel</span>'s speed: double the speed, double the voltage. At 8 rev/s the model's EMF averages 1.0 V once rectified (peaking at 1.57 V), and that average is what the electronics can use. Say these figures are the model's: the 1.0 V, the sine shape, and the single pole pair are assumptions (PHYSICS.md, D4 and D9), and the one coil drawn stands for the 9R's winding, whose layout this project has not sourced. Note that here the reader turns the wheel and nothing draws current, so nothing pushes back; lead into the next section, where drawing current brakes the wheel. -->
      </section>

      <section id="lenz-brake" aria-labelledby="lenz-brake-title">
        <h2 id="lenz-brake-title">Electricity pushes back</h2>
        <!-- PROSE: drawing current from the <span class="part" data-part="coil">coil</span> brakes the <span class="part" data-part="rotor">glide wheel</span>. The current the moving magnet induces makes a magnetic field of its own that opposes the motion (Lenz's law), so every joule the coil turns to heat comes out of the wheel's motion. Open, the coil carries no current and does nothing; shorted, it brakes. Explain that the watch shorts it in short bursts, and the fraction of the time it is shorted sets the average braking. Invite the reader to let the wheel go from 8 rev/s and try different settings of the slider. -->
        <figure class="widget-slot" data-widget="lenz-brake"></figure>
        <!-- PROSE: what the reader just saw. Here the <span class="part" data-part="mainspring">mainspring</span> is left out, so only friction and the brake slow the <span class="part" data-part="rotor">glide wheel</span>. With the <span class="part" data-part="coil">coil</span> open, friction alone stops it in about 1.1 s; shorted all the time, it stops in about 0.11 s, because at 8 rev/s the full brake is about 21 times friction (the model's 199 nN·m against 9.5 nN·m). The brake is proportional to speed and to the time shorted, so it is a smooth, adjustable drag with nothing touching the wheel. Say these figures are the model's (PHYSICS.md, D4 and D10): the coil's resistance, the EMF constant, and the friction are assumptions, and the widget's all-or-nothing switch stands for a circuit whose details Seiko has not published. Lead into the next question: to hold 8 rev/s, the brake has to know how fast the wheel should turn, which needs a reference. -->
      </section>

      <section id="quartz" aria-labelledby="quartz-title">
        <h2 id="quartz-title">A reference that doesn't drift</h2>
        <!-- PROSE: the <span class="part" data-part="quartz">quartz crystal</span> at 32,768 Hz, divided down to the 8 Hz reference. Widget slot (quartz) lands in M6. -->
      </section>

      <section id="loop" aria-labelledby="loop-title">
        <h2 id="loop-title">Closing the loop</h2>
        <!-- PROSE: the <span class="part" data-part="ic">IC</span> compares the <span class="part" data-part="rotor">glide wheel</span> against the reference and sets the brake. Widget slot (loop) lands in M7. -->
      </section>

      <section id="tri-synchro" aria-labelledby="tri-synchro-title">
        <h2 id="tri-synchro-title">Tri-synchro, all together</h2>
        <!-- PROSE: the whole system, from full wind to rundown, powered by the <span class="part" data-part="capacitor">capacitor</span> it charges. Widget slot (tri-synchro) lands in M8. -->
      </section>

      <footer class="article-footer">
        <p class="footnote">
          Thanks to Bartosz Ciechanowski, whose
          <a href="https://ciechanow.ski/mechanical-watch/">Mechanical Watch</a>
          inspired this project.
        </p>
      </footer>
    </main>

    <button type="button" class="global-pause" data-global-pause hidden>
      Pause animations
    </button>
  </body>
</html>
