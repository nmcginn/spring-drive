name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install`, so a PR that forgets to commit
      # package-lock.json fails here rather than silently resolving different
      # versions than the author had.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and physics tests
        run: npm test

      # Every headless scenario, so one that throws is caught here rather than
      # the first time someone runs it. Writes to tools/out/, which is discarded.
      - name: Run every sim scenario
        run: npm run sim -- all

      - name: Build
        run: npm run build

      # Reported, never gated: the number that matters is the per-frame budget
      # in M9, but a bundle that doubles overnight is worth a reviewer's glance.
      - name: Report bundle size
        run: |
          {
            echo '### Bundle size'
            echo
            echo '| File | Bytes | Gzipped |'
            echo '|---|---:|---:|'
            find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.woff2' \) | sort | while read -r f; do
              echo "| \`${f#dist/}\` | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only Chromium: the smoke tests prove mounting, interaction, and a clean
      # console, which do not need three engines to be believed.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Builds first, then runs against `vite preview` of that build.
      - name: Smoke tests
        run: npm run test:e2e

      # The frame budget's figures at every stop (decision 39), so a reviewer
      # sees them without checking out the branch. Reported whether or not
      # the budget held.
      - name: Report frame budget
        if: always()
        run: |
          if [ -f test-results/budget/rows.md ]; then
            {
              echo '### Frame budget (4 ms)'
              echo
              echo "Widget ticks are timed by the page itself. Main thread is Chrome's trace of the page's main thread, which in CI includes rasterising the canvases, work a GPU does off the main thread on a reader's machine. The budget is asserted on Widgets mean and on Main less raster (decision 39). All in ms per frame."
              echo
              echo '| Project | Stop | Widgets mean | Widgets p95 | Each widget | Main thread | Canvas raster | Main less raster |'
              echo '|---|---|---:|---:|---|---:|---:|---:|'
              cat test-results/budget/rows.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The screenshots are how widget work gets reviewed without checking out
      # the branch, so they are uploaded whether or not the tests passed.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
